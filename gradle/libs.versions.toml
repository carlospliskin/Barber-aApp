[versions]
agp                 = "9.5.1"
kotlin              = "2.4.21"
coroutines          = "1.11.0"
serialization       = "1.13.0"
firebase-bom        = "35.2.0"
crashlytics-plugin  = "3.0.8"
kotlinter           = "5.7.0"
koin                = "4.2.2"
compose-bom         = "2026.09.00"
androidx-core       = "1.19.1"
androidx-activity   = "1.13.0"
androidx-lifecycle  = "2.11.0"
androidx-navigation = "2.10.2"
androidx-datastore  = "1.3.0"
androidx-work       = "2.12.0"
junit4              = "4.13.2"
androidx-test       = "1.7.0"
androidx-test-junit = "1.3.0"
turbine             = "1.2.1"

[libraries]
coroutines-core     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

firebase-bom        = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-auth       = { module = "com.google.firebase:firebase-auth" }
firebase-firestore  = { module = "com.google.firebase:firebase-firestore" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }

koin-core           = { module = "io.insert-koin:koin-core",              version.ref = "koin" }
koin-android        = { module = "io.insert-koin:koin-android",           version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-test           = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-test-junit4    = { module = "io.insert-koin:koin-test-junit4", version.ref = "koin" }

androidx-core-ktx   = { module = "androidx.core:core-ktx",                version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }

compose-bom         = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui          = { module = "androidx.compose.ui:ui" }
compose-ui-tooling  = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3   = { module = "androidx.compose.material3:material3" }

junit4              = { module = "junit:junit",              version.ref = "junit4" }
androidx-test-runner = { module = "androidx.test:runner",      version.ref = "androidx-test" }
androidx-test-core  = { module = "androidx.test:core",         version.ref = "androidx-test" }
androidx-test-junit  = { module = "androidx.test.ext:junit",   version.ref = "androidx-test-junit" }
turbine             = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Para build-logic (convention plugins)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin  = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application  = { id = "com.android.application",                  version.ref = "agp" }
android-library      = { id = "com.android.library",                      version.ref = "agp" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                 version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler     = { id = "org.jetbrains.kotlin.plugin.compose",      version.ref = "kotlin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics-plugin" }
kotlinter            = { id = "org.jmailen.kotlinter",          version.ref = "kotlinter" }
barberia-android-library = { id = "barberia.android.library" }
barberia-android-compose = { id = "barberia.android.compose" }
barberia-jvm-library     = { id = "barberia.jvm.library" }
