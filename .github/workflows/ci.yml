name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-map:
    name: Mapa de la app al día
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: docs/APP_MAP.md coincide con el código
        run: python3 scripts/app_map.py --check

  android:
    name: Tests unitarios y builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Estilo (ktlint)
        run: ./gradlew lintKotlin
      - name: Tests (dominio, datos, ViewModels, grafo de Koin)
        run: ./gradlew test --stacktrace
      - name: Build debug y QA (QA = release con R8)
        run: ./gradlew :app:assembleDebug :app:assembleQa
      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  firestore-rules:
    name: Reglas de Firestore (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6 # el emulador de Firestore corre en Java
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
      - run: npm test
