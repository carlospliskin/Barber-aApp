name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-map:
    name: Mapa de la app al día
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: docs/APP_MAP.md coincide con el código
        run: python3 scripts/app_map.py --check

  android:
    name: Tests unitarios y builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Estilo (ktlint)
        run: ./gradlew lintKotlin
      - name: Tests (dominio, datos, ViewModels, grafo de Koin)
        run: ./gradlew test --stacktrace
      - name: Build debug y QA (QA = release con R8)
        run: ./gradlew :app:assembleDebug :app:assembleQa
      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  firestore-rules:
    name: Reglas de Firestore (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6 # el emulador de Firestore corre en Java
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
      - run: npm test

  instrumented:
    name: Tests instrumentados (emulador Android + Firebase)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Habilitar KVM (acelera el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
        working-directory: firebase
      - name: APKs de prueba (antes de encender el emulador)
        run: ./gradlew :feature:auth:data:assembleDebugAndroidTest :feature:catalog:data:assembleDebugAndroidTest :feature:booking:data:assembleDebugAndroidTest
      - name: Emulator Suite + emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: firebase/node_modules/.bin/firebase emulators:exec --only auth,firestore --project demo-barberia "ANDROID_SERIAL=emulator-5554 ADB_SERVER_PORT=5037 scripts/android-tests.sh"
