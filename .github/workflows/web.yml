name: Páginas web (privacidad y borrar cuenta)

# Solo a mano: publica web/ en GitHub Pages. Antes, activa Pages en Settings → Pages → Source: GitHub Actions
# y reemplaza los {{...}} de las páginas. Ver docs/RELEASE.md (PLAY-1).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Sin marcadores pendientes
        run: "! grep -rn '{{' web/"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
